name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.cc }}${{ matrix.sanitize && ' + sanitizers' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        # SANITIZE=1 builds with AddressSanitizer and UndefinedBehaviorSanitizer.
        sanitize: ['', '1']
    steps:
      - uses: actions/checkout@v4

      # Unit tests plus the Blargg test ROMs, with the makefile's strict
      # warnings as errors. The makefile falls back to -std=c2x on compilers
      # that predate -std=c23.
      - name: make check
        run: make -j"$(nproc)" CC=${{ matrix.cc }} SANITIZE=${{ matrix.sanitize }} check

  # The SDL front end builds against the core and starts headless: SDL's
  # dummy video driver needs no display.
  sdl:
    name: SDL front end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev pkg-config

      - name: Build
        run: make -j"$(nproc)" sdl

      - name: Run a few frames headless
        run: SDL_VIDEODRIVER=dummy build/gameboy-sdl roms/dmg-acid2.gb --frames 60 --scale 2

  # The Mooneye acceptance ROMs for the DMG. Known failures are listed in
  # tools/mooneye-expected-failures.txt; a new failure fails the job.
  mooneye:
    name: Mooneye ROMs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the Mooneye ROMs
        run: make -j"$(nproc)" mooneye
